<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <!-- Gradient for Shield Border -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    
    <!-- Gradient for Inner Shield -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>

    <!-- Mountain Gradient -->
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Outer Shield Border -->
  <path d="M 100 12 
           C 145 12, 182 25, 185 65 
           C 188 125, 160 190, 100 225 
           C 40 190, 12 125, 15 65 
           C 18 25, 55 12, 100 12 Z" 
        fill="url(#goldGrad)" 
        stroke="#78350F" 
        stroke-width="2"/>

  <!-- Inner Shield Fill -->
  <path d="M 100 20 
           C 138 20, 172 32, 175 67 
           C 178 119, 152 178, 100 212 
           C 48 178, 22 119, 25 67 
           C 28 32, 62 20, 100 20 Z" 
        fill="url(#shieldBg)" 
        stroke="#FDE68A" 
        stroke-width="1.5"/>

  <!-- Gold Star at Top -->
  <polygon points="100,28 104,39 115,39 106,46 109,57 100,50 91,57 94,46 85,39 96,39" 
           fill="#FCD34D" 
           stroke="#D97706" 
           stroke-width="0.8"/>

  <!-- Mountain Silhouette (Gunung Slamet) -->
  <path d="M 45 135 L 75 105 L 100 82 L 130 110 L 155 135 Z" fill="url(#mountainGrad)"/>
  <path d="M 85 96 L 100 82 L 115 95" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>

  <!-- Tree / Pohon Beringin Center -->
  <path d="M 96 135 L 96 118 L 104 118 L 104 135 Z" fill="#78350F"/>
  <circle cx="100" cy="112" r="16" fill="#10B981"/>
  <circle cx="92" cy="115" r="11" fill="#059669"/>
  <circle cx="108" cy="115" r="11" fill="#047857"/>
  <circle cx="100" cy="104" r="10" fill="#34D399"/>

  <!-- Water Waves at Base -->
  <path d="M 38 142 Q 60 137 80 142 T 120 142 T 162 142 L 165 155 Q 135 162 100 162 Q 65 162 35 155 Z" fill="#0284C7"/>
  <path d="M 42 148 Q 70 144 100 148 T 158 148" fill="none" stroke="#E0F2FE" stroke-width="1.5"/>

  <!-- Rice Stalk (Padi - Left) -->
  <g fill="#FBBF24" stroke="#B45309" stroke-width="0.5">
    <path d="M 35 130 Q 30 90 55 60 Q 52 75 42 95 Q 38 115 45 135" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="48" cy="68" r="3.5"/>
    <circle cx="42" cy="76" r="3.5"/>
    <circle cx="38" cy="86" r="3.5"/>
    <circle cx="36" cy="98" r="3.5"/>
    <circle cx="36" cy="110" r="3.5"/>
    <circle cx="39" cy="122" r="3.5"/>
  </g>

  <!-- Cotton Stalk (Kapas - Right) -->
  <g fill="#FFFFFF" stroke="#047857" stroke-width="1">
    <path d="M 165 130 Q 170 90 145 60 Q 148 75 158 95 Q 162 115 155 135" fill="none" stroke="#10B981" stroke-width="2"/>
    <circle cx="152" cy="68" r="4.5" fill="#FFFFFF"/>
    <circle cx="158" cy="78" r="4.5" fill="#FFFFFF"/>
    <circle cx="162" cy="90" r="4.5" fill="#FFFFFF"/>
    <circle cx="163" cy="103" r="4.5" fill="#FFFFFF"/>
    <circle cx="161" cy="116" r="4.5" fill="#FFFFFF"/>
  </g>

  <!-- Ribbon at Bottom -->
  <path d="M 30 178 L 50 170 L 150 170 L 170 178 L 160 192 L 140 186 L 100 190 L 60 186 L 40 192 Z" 
        fill="#FBBF24" 
        stroke="#92400E" 
        stroke-width="1.5"/>
  
  <!-- Ribbon Text -->
  <text x="100" y="183" 
        font-family="'Plus Jakarta Sans', Arial, sans-serif" 
        font-size="8" 
        font-weight="800" 
        fill="#78350F" 
        text-anchor="middle" 
        letter-spacing="0.5">
    PURBALINGGA
  </text>
</svg>
