version: "3.8"

# ============================================
# e-Notulen — Docker Compose (Development)
# ============================================
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#
# This only runs infrastructure services.
# Frontend and Backend run locally with hot reload:
#   cd frontend && npm run dev
#   cd backend && go run cmd/server/main.go
# ============================================

services:
  # ── PostgreSQL ─────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: enotulen-dev-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=enotulen
      - POSTGRES_USER=enotulen
      - POSTGRES_PASSWORD=enotulen_dev
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    networks:
      - enotulen-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enotulen -d enotulen"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (Object Storage) ─────────────────
  minio:
    image: minio/minio:latest
    container_name: enotulen-dev-minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console (http://localhost:9001)
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-dev-data:/data
    networks:
      - enotulen-dev-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── MinIO Setup ────────────────────────────
  minio-setup:
    image: minio/mc:latest
    container_name: enotulen-dev-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set myminio http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing myminio/e-notulen;
        mc anonymous set download myminio/e-notulen/public;
        echo 'MinIO dev bucket setup complete';
        exit 0;
      "
    networks:
      - enotulen-dev-network

volumes:
  postgres-dev-data:
    driver: local
  minio-dev-data:
    driver: local

networks:
  enotulen-dev-network:
    driver: bridge
